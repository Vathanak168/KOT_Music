<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0B0D17"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Glowing vinyl circles -->
  <circle cx="256" cy="256" r="160" fill="#111827" stroke="#1F2937" stroke-width="8"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#374151" stroke-width="2" stroke-dasharray="10 5" opacity="0.6"/>
  <circle cx="256" cy="256" r="85" fill="none" stroke="#4B5563" stroke-width="2" stroke-dasharray="6 4" opacity="0.4"/>

  <!-- Glowing center badge -->
  <circle cx="256" cy="256" r="55" fill="url(#accentGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="18" fill="#0B0D17"/>

  <!-- Music Note / Soundwave overlay -->
  <path d="M 230 190 L 230 250 A 25 25 0 1 1 205 225 L 205 160 L 310 135 L 310 230 A 25 25 0 1 1 285 205 L 285 170 Z" fill="#FFFFFF" opacity="0.95"/>
</svg>
